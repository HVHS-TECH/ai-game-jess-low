<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe vs AI</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 40px;
        background: #f4f4f4;
    }

    h1 { margin-bottom: 20px; }

    #board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
        gap: 5px;
    }

    .cell {
        width: 100px;
        height: 100px;
        background: white;
        border: 2px solid #333;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2.5rem;
        cursor: pointer;
    }

    #status {
        margin-top: 20px;
        font-size: 1.3rem;
        font-weight: bold;
    }

    #reset {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>Tic Tac Toe vs AI</h1>

<div id="board"></div>

<div id="status">Your turn (X)</div>
<button id="reset">Reset Game</button>

<script>
    const board = document.getElementById("board");
    const statusText = document.getElementById("status");
    const resetBtn = document.getElementById("reset");

    let cells = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;

    const HUMAN = "X";
    const AI = "O";

    const winningCombos = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    function createBoard() {
        board.innerHTML = "";
        cells.forEach((_, index) => {
            const cell = document.createElement("div");
            cell.classList.add("cell");
            cell.dataset.index = index;
            cell.addEventListener("click", handleHumanMove);
            board.appendChild(cell);
        });
    }

    function handleHumanMove(e) {
        const index = e.target.dataset.index;

        if (cells[index] !== "" || !gameActive) return;

        makeMove(index, HUMAN);

        if (!gameActive) return;

        setTimeout(aiMove, 300); // slight delay for realism
    }

    function makeMove(index, player) {
        cells[index] = player;
        document.querySelector(`[data-index="${index}"]`).textContent = player;

        if (checkWin(player)) {
            statusText.textContent = `${player} wins!`;
            gameActive = false;
            return;
        }

        if (cells.every(cell => cell !== "")) {
            statusText.textContent = "It's a draw!";
            gameActive = false;
            return;
        }

        statusText.textContent = player === HUMAN ? "AI thinking..." : "Your turn (X)";
    }

    function aiMove() {
        const bestIndex = minimax(cells, AI).index;
        makeMove(bestIndex, AI);
    }

    function checkWin(player) {
        return winningCombos.some(combo =>
            combo.every(i => cells[i] === player)
        );
    }

    function minimax(newBoard, player) {
        const available = newBoard
            .map((v, i) => v === "" ? i : null)
            .filter(v => v !== null);

        if (checkWin(HUMAN)) return { score: -10 };
        if (checkWin(AI)) return { score: 10 };
        if (available.length === 0) return { score: 0 };

        const moves = [];

        for (let i of available) {
            const move = {};
            move.index = i;
            newBoard[i] = player;

            if (player === AI) {
                move.score = minimax(newBoard, HUMAN).score;
            } else {
                move.score = minimax(newBoard, AI).score;
            }

            newBoard[i] = "";
            moves.push(move);
        }

        let bestMove;
        if (player === AI) {
            bestMove = moves.reduce((best, m) => m.score > best.score ? m : best);
        } else {
            bestMove = moves.reduce((best, m) => m.score < best.score ? m : best);
        }

        return bestMove;
    }

    resetBtn.addEventListener("click", () => {
        cells = ["", "", "", "", "", "", "", "", ""];
        gameActive = true;
        statusText.textContent = "Your turn (X)";
        createBoard();
    });

    createBoard();
</script>

</html>
