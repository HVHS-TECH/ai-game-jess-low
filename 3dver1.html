<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Tic Tac Toe (Movable Camera)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    h1 { margin-bottom: 5px; }
    #info { margin-bottom: 15px; color: #ccc; }

    /* CAMERA WRAPPER */
    #camera {
        width: 320px;
        height: 320px;
        perspective: 900px;
        cursor: grab;
        margin-top: 20px;
    }
    #camera:active { cursor: grabbing; }

    /* 3D BOARD CONTAINER */
    #levels-container {
        width: 320px;
        height: 320px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
    }

    /* LEVELS */
    .level {
        position: absolute;
        top: 0;
        left: 0;
        width: 320px;
        height: 320px;
        display: grid;
        grid-template-columns: repeat(3, 80px);
        grid-template-rows: repeat(3, 80px);
        gap: 10px;
        padding: 10px;
        background: rgba(34,34,34,0.95);
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.6);
        transform-style: preserve-3d;
    }

    /* STACK SPACING */
    .level0 { transform: translateZ(-120px); }
    .level1 { transform: translateZ(0px); }
    .level2 { transform: translateZ(120px); }

    /* CELLS */
    .cell {
        width: 80px;
        height: 80px;
        background: #333;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2.2rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
    }
    .cell:hover {
        background: #444;
        transform: translateY(-2px);
    }

    #status {
        margin-top: 20px;
        font-size: 1.2rem;
        font-weight: bold;
    }

    #reset {
        margin-top: 10px;
        padding: 8px 16px;
        background: #4caf50;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>3D Tic Tac Toe</h1>
<div id="info">Click and drag to rotate the camera. You are X. AI is O.</div>

<div id="camera">
    <div id="levels-container"></div>
</div>

<div id="status">Your turn (X)</div>
<button id="reset">Reset Game</button>

<script>
/* ---------------- BASIC SETUP ---------------- */
const SIZE = 3;
const TOTAL = SIZE ** 3;
let board = Array(TOTAL).fill("");
let gameActive = true;

const HUMAN = "X";
const AI = "O";

let winningLines = [];

const camera = document.getElementById("camera");
const container = document.getElementById("levels-container");
const statusText = document.getElementById("status");

/* ---------------- CAMERA CONTROL ---------------- */
let camX = 35;   // tilt downward
let camY = 0;    // rotate left-right
let dragging = false;
let lastX = 0;

camera.addEventListener("mousedown", e => {
    dragging = true;
    lastX = e.clientX;
});

document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    camY += dx * 0.4;
    updateCamera();
});

function updateCamera() {
    container.style.transform = `rotateX(${camX}deg) rotateY(${camY}deg)`;
}

/* ---------------- BOARD CREATION ---------------- */
function index(x, y, z) {
    return z * 9 + y * 3 + x;
}

function createBoardUI() {
    container.innerHTML = "";

    for (let z = 0; z < SIZE; z++) {
        const level = document.createElement("div");
        level.classList.add("level", `level${z}`);

        for (let y = 0; y < SIZE; y++) {
            for (let x = 0; x < SIZE; x++) {
                const cell = document.createElement("div");
                cell.classList.add("cell");
                const idx = index(x, y, z);
                cell.dataset.index = idx;
                cell.addEventListener("click", handleHumanMove);
                level.appendChild(cell);
            }
        }
        container.appendChild(level);
    }
}

/* ---------------- WINNING LINES ---------------- */
function generateWinningLines() {
    const lines = [];

    // Rows, columns, diagonals per level
    for (let z = 0; z < SIZE; z++) {
        for (let y = 0; y < SIZE; y++)
            lines.push([0,1,2].map(x => index(x, y, z)));

        for (let x = 0; x < SIZE; x++)
            lines.push([0,1,2].map(y => index(x, y, z)));

        lines.push([0,1,2].map(i => index(i, i, z)));
        lines.push([0,1,2].map(i => index(2-i, i, z)));
    }

    // Vertical lines
    for (let x = 0; x < SIZE; x++)
        for (let y = 0; y < SIZE; y++)
            lines.push([0,1,2].map(z => index(x, y, z)));

    // Space diagonals
    lines.push([0,1,2].map(i => index(i, i, i)));
    lines.push([0,1,2].map(i => index(2-i, i, i)));
    lines.push([0,1,2].map(i => index(i, 2-i, i)));
    lines.push([0,1,2].map(i => index(2-i, 2-i, i)));

    winningLines = lines;
}

/* ---------------- GAME LOGIC ---------------- */
function handleHumanMove(e) {
    if (!gameActive) return;

    const idx = parseInt(e.target.dataset.index);
    if (board[idx] !== "") return;

    makeMove(idx, HUMAN);

    if (!gameActive) return;

    statusText.textContent = "AI thinking...";
    setTimeout(aiMove, 300);
}

function makeMove(idx, player) {
    board[idx] = player;
    document.querySelector(`.cell[data-index="${idx}"]`).textContent = player;

    if (checkWin(player)) {
        statusText.textContent = player === HUMAN ? "You win!" : "AI wins!";
        gameActive = false;
        return;
    }

    if (board.every(c => c !== "")) {
        statusText.textContent = "Draw!";
        gameActive = false;
        return;
    }

    if (player === AI) statusText.textContent = "Your turn (X)";
}

function checkWin(player) {
    return winningLines.some(line =>
        line.every(i => board[i] === player)
    );
}

function getAvailableMoves() {
    return board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
}

/* ---------------- DUMB AI ---------------- */
/* AI behavior:
   1. 30% chance: random move
   2. Try to block human win
   3. Otherwise random
*/
function aiMove() {
    if (!gameActive) return;

    const available = getAvailableMoves();

    // 30% pure random
    if (Math.random() < 0.3) {
        const r = available[Math.floor(Math.random() * available.length)];
        makeMove(r, AI);
        return;
    }

    // Try to block human
    for (const idx of available) {
        board[idx] = HUMAN;
        if (checkWin(HUMAN)) {
            board[idx] = "";
            makeMove(idx, AI);
            return;
        }
        board[idx] = "";
    }

    // Otherwise random
    const r = available[Math.floor(Math.random() * available.length)];
    makeMove(r, AI);
}

/* ---------------- RESET ---------------- */
document.getElementById("reset").addEventListener("click", () => {
    board = Array(TOTAL).fill("");
    gameActive = true;
    statusText.textContent = "Your turn (X)";
    createBoardUI();
});

/* ---------------- INIT ---------------- */
generateWinningLines();
createBoardUI();
updateCamera();
</script>

</html>
