<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Tic Tac Toe (3×3×3)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
    }

    h1 {
        margin-bottom: 10px;
    }

    #levels-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }

    .level {
        display: grid;
        grid-template-columns: repeat(3, 60px);
        grid-template-rows: repeat(3, 60px);
        gap: 5px;
        padding: 10px;
        border-radius: 8px;
        background: #222;
        box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .level-title {
        text-align: center;
        margin-top: 5px;
        font-size: 0.9rem;
        color: #aaa;
    }

    .cell {
        width: 60px;
        height: 60px;
        background: #333;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
    }

    .cell:hover {
        background: #444;
        transform: translateY(-2px);
    }

    #status {
        margin-top: 20px;
        font-size: 1.2rem;
        font-weight: bold;
    }

    #reset {
        margin-top: 10px;
        padding: 8px 16px;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: #4caf50;
        color: white;
    }

    #reset:hover {
        background: #43a047;
    }
</style>
</head>
<body>

<h1>3D Tic Tac Toe (3×3×3)</h1>
<div>Levels: bottom (0), middle (1), top (2)</div>

<div id="levels-container"></div>

<div id="status">Player X's turn</div>
<button id="reset">Reset Game</button>

<script>
    const levelsContainer = document.getElementById("levels-container");
    const statusText = document.getElementById("status");
    const resetBtn = document.getElementById("reset");

    const SIZE = 3;          // 3×3×3
    const TOTAL = SIZE**3;   // 27 cells
    let board = Array(TOTAL).fill("");
    let currentPlayer = "X";
    let gameActive = true;
    let winningLines = [];

    function index(x, y, z) {
        return z * SIZE * SIZE + y * SIZE + x;
    }

    function createBoardUI() {
        levelsContainer.innerHTML = "";
        for (let z = 0; z < SIZE; z++) {
            const levelWrapper = document.createElement("div");
            const level = document.createElement("div");
            level.classList.add("level");
            levelWrapper.appendChild(level);

            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    const cell = document.createElement("div");
                    cell.classList.add("cell");
                    const idx = index(x, y, z);
                    cell.dataset.index = idx;
                    cell.addEventListener("click", handleCellClick);
                    level.appendChild(cell);
                }
            }

            const title = document.createElement("div");
            title.classList.add("level-title");
            title.textContent = `Level ${z}`;
            levelWrapper.appendChild(title);

            levelsContainer.appendChild(levelWrapper);
        }
    }

    function generateWinningLines() {
        const lines = [];

        // Rows and columns on each level
        for (let z = 0; z < SIZE; z++) {
            for (let y = 0; y < SIZE; y++) {
                lines.push([0,1,2].map(x => index(x, y, z))); // rows
            }
            for (let x = 0; x < SIZE; x++) {
                lines.push([0,1,2].map(y => index(x, y, z))); // columns
            }
            // Diagonals on each level
            lines.push([0,1,2].map(i => index(i, i, z)));
            lines.push([0,1,2].map(i => index(2 - i, i, z)));
        }

        // Vertical lines (through levels)
        for (let x = 0; x < SIZE; x++) {
            for (let y = 0; y < SIZE; y++) {
                lines.push([0,1,2].map(z => index(x, y, z)));
            }
        }

        // Vertical diagonals in planes parallel to YZ (x fixed)
        for (let x = 0; x < SIZE; x++) {
            lines.push([0,1,2].map(i => index(x, i, i)));
            lines.push([0,1,2].map(i => index(x, 2 - i, i)));
        }

        // Vertical diagonals in planes parallel to XZ (y fixed)
        for (let y = 0; y < SIZE; y++) {
            lines.push([0,1,2].map(i => index(i, y, i)));
            lines.push([0,1,2].map(i => index(2 - i, y, i)));
        }

        // 4 main space diagonals
        lines.push([0,1,2].map(i => index(i, i, i)));
        lines.push([0,1,2].map(i => index(2 - i, i, i)));
        lines.push([0,1,2].map(i => index(i, 2 - i, i)));
        lines.push([0,1,2].map(i => index(2 - i, 2 - i, i)));

        winningLines = lines;
    }

    function handleCellClick(e) {
        if (!gameActive) return;
        const idx = parseInt(e.target.dataset.index, 10);
        if (board[idx] !== "") return;

        board[idx] = currentPlayer;
        e.target.textContent = currentPlayer;

        if (checkWin(currentPlayer)) {
            statusText.textContent = `Player ${currentPlayer} wins!`;
            gameActive = false;
            return;
        }

        if (board.every(c => c !== "")) {
            statusText.textContent = "It's a draw!";
            gameActive = false;
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s turn`;
    }

    function checkWin(player) {
        return winningLines.some(line =>
            line.every(idx => board[idx] === player)
        );
    }

    resetBtn.addEventListener("click", () => {
        board = Array(TOTAL).fill("");
        currentPlayer = "X";
        gameActive = true;
        statusText.textContent = "Player X's turn";
        createBoardUI();
    });

    generateWinningLines();
    createBoardUI();
</script>
